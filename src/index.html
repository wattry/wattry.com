<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" type="image/svg+xml" href="https://cdn.wattry.com/public/logo/icon.svg" />
    <link rel="icon" href="https://cdn.wattry.com/public/favicons/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="https://cdn.wattry.com/public/favicons/favicon-32.png" sizes="32x32" />
    <link rel="apple-touch-icon" href="https://cdn.wattry.com/public/favicons/apple-touch-icon.png" />

    <meta property="og:image" content="https://cdn.wattry.com/public/social/og-image.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
    <!-- <link rel="manifest" href="/manifest.json" /> -->
    <title>wattry.com</title>
    <style>
      /* Base styles applied before MUI theme + Space Grotesk fonts load (anti-FOUC) */
      html {
        /* Gradient on the canvas (html) only — paints behind the z-index:-1 video.
           Body must stay transparent or it would cover the video. */
        background-color: #000;
        background-image: #000;
        background-attachment: fixed;
      }
      #root {
        min-height: 100vh;
      }
    </style>
  </head>
  <body>
    <img id="top-anchor" src="https://cdn.wattry.com/public/logo/lockup-dark.svg" alt="wattry" height="34" />
    <div id="root"></div>
    <script type="module" src="/main.tsx"></script>
  </body>
</html>
